name: Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  actions: write
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  NODE_VERSION: 22.12.0
  WRANGLER_VERSION: 4.120.0

jobs:
  resolve-production:
    name: Resolve merged PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head-repo: ${{ steps.pr.outputs.head-repo }}
      head-sha: ${{ steps.pr.outputs.head-sha }}
    steps:
      - name: Resolve PR associated with main commit
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")"
          pr="$(jq -c \
            '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last // empty' \
            <<< "$response")"

          if [[ -z "$pr" ]]; then
            echo "Commit $GITHUB_SHA is not associated with a merged PR targeting main." >&2
            exit 1
          fi

          {
            echo "number=$(jq -r '.number' <<< "$pr")"
            echo "head-repo=$(jq -r '.head.repo.full_name' <<< "$pr")"
            echo "head-sha=$(jq -r '.head.sha' <<< "$pr")"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    needs: resolve-production
    concurrency:
      group: preview-pr-${{ needs.resolve-production.outputs.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "1"
      ARTIFACT_NAME: site-pr-${{ needs.resolve-production.outputs.number }}-${{ needs.resolve-production.outputs.head-sha }}
      PREVIEW_WORKER: bastian-ibanez-portfolio-pr-${{ needs.resolve-production.outputs.number }}
    steps:
      - name: Check out merged deployment config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Restore npm cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Locate reviewed build artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$ARTIFACT_NAME" \
            -F per_page=100)"

          artifact="$(jq -c \
            --arg sha "${{ needs.resolve-production.outputs.head-sha }}" \
            '[.artifacts[] | select(.expired == false and .workflow_run.head_sha == $sha)] | sort_by(.created_at) | last // empty' \
            <<< "$response")"

          if [[ -z "$artifact" ]]; then
            echo "No unexpired artifact found for $ARTIFACT_NAME." >&2
            echo "Run the Rebuild artifact workflow for PR #${{ needs.resolve-production.outputs.number }}, then retry this job." >&2
            exit 1
          fi

          echo "run-id=$(jq -r '.workflow_run.id' <<< "$artifact")" >> "$GITHUB_OUTPUT"

      - name: Download reviewed build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact.outputs.run-id }}

      - name: Verify deployable site
        run: test -f dist/index.html

      - name: Deploy cached build to production
        run: |
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy \
            --config wrangler.jsonc \
            --message "PR #${{ needs.resolve-production.outputs.number }} @ ${{ needs.resolve-production.outputs.head-sha }}"

      - name: Delete preview Worker
        if: needs.resolve-production.outputs.head-repo == github.repository
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}?force=true"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            "$api_url")"

          case "$http_status" in
            200|204)
              echo "Deleted preview Worker $PREVIEW_WORKER."
              ;;
            404)
              echo "Preview Worker was already absent."
              ;;
            *)
              echo "Cloudflare returned HTTP $http_status while deleting $PREVIEW_WORKER." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Delete consumed build artifacts
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$ARTIFACT_NAME" \
            -F per_page=100)"

          mapfile -t artifact_ids < <(jq -r '.artifacts[].id' <<< "$response")
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done

      - name: Publish production URL
        run: |
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "https://bastianibanez.com" >> "$GITHUB_STEP_SUMMARY"

  cleanup-abandoned:
    name: Cleanup abandoned PR
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == false
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
      NO_COLOR: "1"
      ARTIFACT_NAME: site-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      PREVIEW_WORKER: bastian-ibanez-portfolio-pr-${{ github.event.pull_request.number }}
    steps:
      - name: Check out cleanup config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete preview Worker
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          api_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${PREVIEW_WORKER}?force=true"
          http_status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request DELETE \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --retry-all-errors \
            "$api_url")"

          case "$http_status" in
            200|204)
              echo "Deleted preview Worker $PREVIEW_WORKER."
              ;;
            404)
              echo "Preview Worker was already absent."
              ;;
            *)
              echo "Cloudflare returned HTTP $http_status while deleting $PREVIEW_WORKER." >&2
              cat "$response_file" >&2
              exit 1
              ;;
          esac

      - name: Delete retained build artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
            -f name="$ARTIFACT_NAME" \
            -F per_page=100)"

          mapfile -t artifact_ids < <(jq -r '.artifacts[].id' <<< "$response")
          for artifact_id in "${artifact_ids[@]}"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
